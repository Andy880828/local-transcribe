[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-transcribe"
version = "0.1.0"
description = "本地影音轉錄 + 講者分辨，agent-native CLI：影片／音檔 → 時間序、標註講者的逐字稿"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "whisperx>=3.3.0",
    "typer>=0.27,<0.28",  # cli.py 依賴 typer 內建的 click 副本，升版需重驗
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[project.scripts]
transcribe = "transcribe.cli:main_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
